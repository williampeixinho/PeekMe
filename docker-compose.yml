# PeekMe: tudo roda em Docker. Para subir: docker compose up -d
# Todos os serviços usam a rede do host (recomendado pelo LiveKit para vídeo).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
      APP_PORT: ${APP_PORT:-3077}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - livekit

  livekit:
    image: livekit/livekit-server:v1.13
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no .env}: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no .env}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  app:
    build: ./app
    image: peekme-app
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: ${APP_PORT:-3077}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      HOST_PASSWORD: ${HOST_PASSWORD:?defina HOST_PASSWORD no .env}
      MAX_VIEWERS: ${MAX_VIEWERS:-5}
    depends_on:
      - livekit

  # Atualiza o DuckDNS com o IP da sua casa a cada 5 minutos.
  # Liga só se COMPOSE_PROFILES=duckdns estiver no .env.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    profiles: [duckdns]
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      TZ: America/Sao_Paulo

volumes:
  caddy_data:
  caddy_config:
