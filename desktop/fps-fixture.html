<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>PeekMe FPS Fixture</title>
<style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#142032}</style>
<canvas width="1600" height="900"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
function draw(t){
  ctx.fillStyle='#142032';ctx.fillRect(0,0,1600,900);
  for(let i=0;i<24;i++){
    ctx.fillStyle=`hsl(${i*15},75%,60%)`;
    ctx.fillRect((t*(0.1+i*0.008)+i*79)%1700-100,(i*67)%850,90,55);
  }
  ctx.fillStyle='white';ctx.font='48px sans-serif';ctx.fillText(`Teste de movimento ${Math.round(t)}`,40,90);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></html>
